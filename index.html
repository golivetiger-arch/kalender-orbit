<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1422"><title>Kalender Orbit</title><style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 100%,#254565 0%,#101e2e 50%,#07101c 100%);color:#f5f7fc;min-height:100dvh;overflow-x:hidden}.app{max-width:1200px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.top{padding:calc(26px + env(safe-area-inset-top)) 24px 12px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;font-weight:700;letter-spacing:.25em}.sub{font-size:11px;color:#a1b2c5;margin-top:7px}.now{border:1px solid #7892a788;background:#ffffff0d;color:white;border-radius:30px;padding:10px 17px;font-size:12px;font-weight:700;letter-spacing:.12em;cursor:pointer}.now:focus-visible,.event:focus-visible{outline:2px solid #fff;outline-offset:4px}.stage{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:440px}.hint{text-align:center;color:#8fa6bc;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px}.orbit{position:relative;width:100%;height:310px;touch-action:pan-y;cursor:grab;user-select:none}.orbit.dragging{cursor:grabbing}.arc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.event{position:absolute;transform:translate(-50%,-50%);background:none;border:0;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;min-width:34px}.dot{height:11px;width:11px;border-radius:50%;background:#192a3c;border:1.5px solid #8298ae;box-shadow:0 0 0 4px #0b182440}.event.selected .dot{height:14px;width:14px;background:#fff;border:2px solid #fff;box-shadow:0 0 18px #b6dcff99}.event.past{opacity:.57}.event .name{font-size:clamp(9px,1.5vw,12px);font-weight:650;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;max-width:125px;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 8px #07101c}.event .time{font-size:10px;color:#aabbd0;white-space:nowrap}.readout{text-align:center;padding:0 16px 28px}.clock{font-size:clamp(49px,10vw,100px);font-weight:300;letter-spacing:.045em;font-variant-numeric:tabular-nums;line-height:1.05}.date{font-size:13px;color:#b6c5d5;text-transform:lowercase;letter-spacing:.13em;margin-top:9px}.selected-info{min-height:60px;margin:26px auto 0;font-size:14px;color:#dce7f4}.selected-info small{display:block;margin-top:6px;color:#a5b8cd}.foot{padding:0 22px calc(25px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;gap:14px;align-items:center;color:#9eafc1;font-size:11px}.status{max-width:70%}.pill{border:1px solid #5c718477;border-radius:20px;padding:8px 12px;white-space:nowrap}#empty{display:none;text-align:center;color:#9eafc1;position:absolute;left:0;right:0;top:65px;font-size:13px;pointer-events:none}@media(max-width:620px){.top{padding-left:17px;padding-right:17px}.stage{min-height:430px}.orbit{height:260px}.event .name{max-width:75px;font-size:9px}.event .time{font-size:9px}.readout{padding-bottom:25px}.foot{font-size:10px}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">KALENDER / ORBIT</div><div class="sub">Deine Zeit auf einer Linie</div></div><button class="now" id="now">● JETZT</button></header><section class="stage"><div class="hint">↔ Bogen ziehen, um durch die Zeit zu reisen</div><div class="orbit" id="orbit"><svg class="arc" id="arc" aria-hidden="true"><path id="track" fill="none" stroke="#a5bdd0" stroke-width="1.5" opacity=".86"/><path id="track2" fill="none" stroke="#a5bdd0" stroke-width="1" opacity=".18"/></svg><div id="points"></div><div id="empty">Keine Termine in diesem Zeitraum</div></div><div class="readout"><div class="clock" id="clock">--:--:--</div><div class="date" id="date"></div><div class="selected-info" id="details"></div></div></section><footer class="foot"><span class="status" id="status">Kalender wird geladen …</span><span class="pill" id="counter">0 Termine</span></footer></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),orbit=$('orbit'),points=$('points');const params=new URLSearchParams(location.search);const fmt=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const tf=new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit'});let events=[],focus=Date.now(),following=true,lastInteract=0,drag=null,selected=null;const HOUR=3600000,spanHours=13;
function parseData(){let raw=params.get('data');if(raw){try{events=raw.split(/\r?\n/).filter(Boolean).map((line,i)=>{const p=line.split('|');if(p.length<3)throw Error('Ungültige Zeile '+(i+1));const start=new Date(p[0]),end=new Date(p[1]);if(!Number.isFinite(+start))throw Error('Ungültiges Datum');return {id:i,start:+start,end:Number.isFinite(+end)?+end:+start,title:decodeURIComponent(p.slice(2).join('|'))};}).sort((a,b)=>a.start-b.start);$('status').textContent='Kalenderdaten aus iOS-Kurzbefehle · '+events.length+' Einträge';}catch(e){$('status').textContent='Kalenderdaten konnten nicht gelesen werden: '+e.message;events=[];}}else{const n=new Date(),d=new Date(n.getFullYear(),n.getMonth(),n.getDate());const examples=[[9,0,'Teammeeting'],[11,30,'Projektbesprechung'],[14,0,'Design Review'],[16,15,'Kundentermin'],[19,0,'Abendessen']];events=examples.map(([h,m,title],i)=>({id:i,start:+d+(h*60+m)*60000,end:+d+(h*60+m+45)*60000,title}));$('status').textContent='DEMO · Für echte Termine über Kurzbefehle öffnen';} $('counter').textContent=events.length+' Termine';}
function geo(x,w,h){const nx=(x-w/2)/(w/2);return 0.22*h+0.52*h*nx*nx}function render(){const now=Date.now();if(following)focus=now;const w=orbit.clientWidth,h=orbit.clientHeight;if(!w)return;const y0=geo(0,w,h),ym=geo(w/2,w,h),y1=geo(w,w,h);$('arc').setAttribute('viewBox',`0 0 ${w} ${h}`);$('track').setAttribute('d',`M 0 ${y0} Q ${w/2} ${2*ym-y0} ${w} ${y1}`);$('track2').setAttribute('d',`M 0 ${y0+25} Q ${w/2} ${2*ym-y0+45} ${w} ${y1+25}`);points.replaceChildren();let visible=0;for(const e of events){const x=w/2+(e.start-focus)/(spanHours*HOUR)*(w*.9);if(x< -55||x>w+55)continue;visible++;const y=geo(x,w,h);const b=document.createElement('button');b.className='event'+(e.start<now?' past':'')+(selected===e.id?' selected':'');b.style.left=x+'px';b.style.top=y+'px';b.setAttribute('aria-label',`${e.title}, ${tf.format(e.start)}`);const label=document.createElement('span');label.className='name';label.textContent=e.title;const dot=document.createElement('span');dot.className='dot';const time=document.createElement('span');time.className='time';time.textContent=tf.format(e.start);b.append(label,dot,time);b.addEventListener('click',()=>{selected=e.id;focus=e.start;following=false;lastInteract=Date.now();render()});points.append(b);} $('empty').style.display=visible?'none':'block';$('clock').textContent=new Date(now).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('date').textContent=fmt.format(new Date(focus));const e=events.find(e=>e.id===selected);$('details').replaceChildren();if(e){const title=document.createElement('div');title.textContent=e.title;const info=document.createElement('small');info.textContent=fmt.format(e.start)+' · '+tf.format(e.start)+(e.end>e.start?'–'+tf.format(e.end):'');$('details').append(title,info);}else{$('details').textContent=following?'AKTUELLE ZEIT':'ZEITLINIE ERKUNDEN';}}
function move(px){focus-=px/(orbit.clientWidth*.9)*spanHours*HOUR;following=false;lastInteract=Date.now();selected=null;render()}orbit.addEventListener('pointerdown',e=>{if(e.target.closest('.event'))return;drag={x:e.clientX,moved:false};orbit.setPointerCapture(e.pointerId);orbit.classList.add('dragging')});orbit.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>1){move(dx);drag.moved=true;drag.x=e.clientX}});function end(){drag=null;orbit.classList.remove('dragging')}orbit.addEventListener('pointerup',end);orbit.addEventListener('pointercancel',end);orbit.addEventListener('wheel',e=>{e.preventDefault();move(e.deltaY*.7+e.deltaX)},{passive:false});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-55);if(e.key==='ArrowRight')move(55)});$('now').addEventListener('click',()=>{following=true;selected=null;render()});window.addEventListener('resize',render);parseData();render();setInterval(()=>{if(!following&&Date.now()-lastInteract>90000){following=true;selected=null}render()},1000);
})();
</script></body></html>
